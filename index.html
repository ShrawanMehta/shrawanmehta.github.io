<style>

  --p1:#4f46e5; --p2:#06b6d4; --p3:#a855f7;
  --grad:linear-gradient(135deg,var(--p1),var(--p2));
  --shadow:0 10px 40px rgba(31,41,80,.08);
  --r:22px;
}
body.dark{
  --bg:#070b16; --card:#0f1626; --card2:#141d33; --text:#e8ecf5; --muted:#97a1b6; --border:#1f2a44;
  --shadow:0 10px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;scroll-padding-top:84px;}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Noto Sans','Noto Sans Devanagari','Noto Sans SC','Noto Naskh Arabic',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased;}
a{color:var(--p1);}
body.dark a{color:#93a4ff;}
img{max-width:100%;}
.skip{position:absolute;inset-inline-start:-999px;top:0;background:#fff;color:#000;padding:10px 16px;z-index:3000;}
.skip:focus{inset-inline-start:10px;top:10px;}
#progress{position:fixed;top:0;inset-inline-start:0;height:3px;width:0;background:var(--grad);z-index:3001;}

/* Nav */
nav{position:sticky;top:12px;z-index:1000;margin:12px auto 0;width:min(1240px,94%);
  background:rgba(15,22,38,.78);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
  border:1px solid rgba(255,255,255,.12);border-radius:60px;display:flex;justify-content:space-between;align-items:center;padding:10px 14px 10px 24px;gap:12px;}
.logo{color:#fff;font-weight:800;font-size:1.15rem;text-decoration:none;white-space:nowrap;letter-spacing:.3px;}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.nav-links{display:flex;gap:4px;list-style:none;align-items:center;}
.nav-links a{color:#cbd5e1;text-decoration:none;font-weight:500;font-size:.9rem;padding:7px 12px;border-radius:30px;transition:.2s;white-space:nowrap;display:block;}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,.08);}
.nav-links a.active{color:#fff;background:rgba(99,102,241,.55);}
body.dark .nav-links a,body.dark .logo{color:#e2e8f0;}
.nav-tools{display:flex;gap:8px;align-items:center;}
.icon-btn,.lang-sel{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:30px;padding:7px 12px;cursor:pointer;font-size:.9rem;}
.icon-btn:hover,.lang-sel:hover{background:rgba(255,255,255,.18);}
.lang-sel option{color:#111;}
.menu-btn{display:none;}

/* Hero */
header#home{position:relative;overflow:hidden;color:#fff;text-align:center;padding:150px 20px 150px;margin-top:-76px;
  background:radial-gradient(1200px 600px at 20% -10%,#3730a3 0%,transparent 60%),radial-gradient(900px 500px at 90% 10%,#0e7490 0%,transparent 55%),#0b1020;}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 14s ease-in-out infinite;}
.orb.a{width:380px;height:380px;background:#6366f1;top:-80px;inset-inline-start:-80px;}
.orb.b{width:320px;height:320px;background:#06b6d4;bottom:-90px;inset-inline-end:-60px;animation-delay:-5s;}
.orb.c{width:240px;height:240px;background:#a855f7;top:40%;inset-inline-start:55%;animation-delay:-9s;opacity:.35;}
@keyframes float{50%{transform:translate(30px,-30px) scale(1.08);}}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);}
.hero-inner{position:relative;z-index:2;max-width:900px;margin:auto;}
.hero-badge{display:inline-block;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:7px 20px;border-radius:30px;font-size:.9rem;margin-bottom:24px;backdrop-filter:blur(6px);}
header#home h1{font-size:clamp(2.6rem,7vw,4.8rem);line-height:1.05;font-weight:800;margin-bottom:14px;letter-spacing:-1px;background:linear-gradient(90deg,#fff,#c7d2fe 50%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent;}
.tagline{font-size:1.25rem;opacity:.92;margin-bottom:12px;}
.typed{font-size:1.1rem;color:#a5b4fc;min-height:1.8em;}
.typed::after{content:"|";margin-inline-start:2px;animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0}}
.hero-actions{margin-top:34px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.btn{display:inline-block;padding:13px 30px;background:#fff;color:#3730a3;text-decoration:none;border-radius:40px;font-weight:700;border:2px solid #fff;cursor:pointer;font-size:1rem;transition:.25s;font-family:inherit;}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(99,102,241,.45);}
.btn.outline{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);}
.btn.outline:hover{background:rgba(255,255,255,.12);}
.btn.solid{background:var(--grad);color:#fff;border-color:transparent;}
body.dark a.btn,body.dark .btn{color:#3730a3;}
body.dark .btn.outline{color:#fff;}
body.dark .btn.solid{color:#fff;}

/* Layout */
.container{width:min(1200px,92%);margin:auto;padding:80px 0 0;}
.section-title{text-align:center;margin-bottom:46px;}
.section-title h2{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:800;letter-spacing:-.5px;}
.section-title h2 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.section-title p{color:var(--muted);margin-top:6px;}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-top:-70px;position:relative;z-index:5;}
.stat{background:var(--card);padding:26px 20px;border-radius:var(--r);text-align:center;box-shadow:var(--shadow);border:1px solid var(--border);}
.stat strong{display:block;font-size:2.3rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2;}
.stat span{color:var(--muted);font-size:.92rem;}

/* Cards */
.panel,.profile-box,.about-content{background:var(--card);padding:32px;border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--border);}
.about{display:grid;grid-template-columns:1fr 2fr;gap:28px;align-items:start;}
.profile-box{text-align:center;position:sticky;top:96px;}
.avatar{width:170px;height:170px;border-radius:50%;margin:0 auto 16px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:800;overflow:hidden;box-shadow:0 0 0 4px var(--card),0 0 0 7px var(--p1);}
.avatar img{width:100%;height:100%;object-fit:cover;}
.role{color:var(--muted);margin-bottom:14px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.chip{background:rgba(79,70,229,.1);color:var(--p1);padding:5px 14px;border-radius:20px;font-size:.84rem;font-weight:600;}
body.dark .chip{background:rgba(129,140,248,.15);color:#a5b4fc;}
.facts{list-style:none;text-align:start;margin-top:18px;font-size:.92rem;}
.facts li{padding:9px 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;}
.facts b{color:var(--muted);font-weight:600;}
.about-content h3{margin:22px 0 6px;font-size:1.15rem;}
.about-content h3:first-child{margin-top:0;}
.about-content h3::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--grad);margin-inline-end:10px;}
.about-content p{color:var(--muted);}
.about-content ul{margin-block:8px 0;margin-inline-start:22px;color:var(--muted);}

/* Tabs / timeline */
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:30px;}
.tab{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 22px;border-radius:30px;cursor:pointer;font-weight:600;transition:.2s;font-family:inherit;font-size:.95rem;}
.tab.on,.tab:hover{background:var(--grad);color:#fff;border-color:transparent;}
.timeline{max-width:820px;margin:auto;border-inline-start:2px solid var(--border);padding-inline-start:30px;}
.t-item{position:relative;margin-bottom:22px;background:var(--card);padding:22px 24px;border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--border);}
.t-item::before{content:"";position:absolute;inset-inline-start:-40px;top:26px;width:16px;height:16px;border-radius:50%;background:var(--grad);border:3px solid var(--bg);}
.t-item small{color:var(--p1);font-weight:700;}
body.dark .t-item small{color:#a5b4fc;}
.t-item h4{margin:3px 0;font-size:1.08rem;}
.t-item .org{color:var(--muted);font-size:.93rem;}
.t-item ul{margin:8px 0 0;margin-inline-start:20px;color:var(--muted);}

/* Skills */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px 44px;}
.skill .row{display:flex;justify-content:space-between;font-weight:600;font-size:.95rem;margin-bottom:6px;}
.bar{height:10px;background:var(--card2);border-radius:10px;overflow:hidden;}
.bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:10px;transition:width 1.2s ease;}

/* Expertise bento */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}
.card{background:var(--card);padding:30px;border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--border);transition:.3s;position:relative;overflow:hidden;}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(400px 160px at 0 0,rgba(99,102,241,.14),transparent 70%);opacity:0;transition:.3s;}
.card:hover{transform:translateY(-8px);border-color:var(--p1);}
.card:hover::after{opacity:1;}
.card .ico{font-size:2rem;margin-bottom:10px;width:56px;height:56px;border-radius:16px;background:var(--card2);display:flex;align-items:center;justify-content:center;}
.card h3{margin-bottom:8px;font-size:1.15rem;}
.card p{color:var(--muted);font-size:.95rem;}

/* List items */
.item{background:var(--card);padding:24px 26px;border-radius:var(--r);margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border);border-inline-start:5px solid var(--p1);}
.item h3{margin-bottom:4px;font-size:1.1rem;}
.item .meta{font-size:.85rem;color:var(--muted);margin-bottom:6px;}
.item p{color:var(--muted);}
.actions{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;}
.mini{font-size:.85rem;padding:7px 16px;border-radius:20px;border:1px solid var(--p1);background:transparent;color:var(--p1);cursor:pointer;text-decoration:none;font-weight:600;font-family:inherit;}
.mini:hover{background:var(--p1);color:#fff;}
body.dark .mini{color:#a5b4fc;border-color:#6366f1;}
.placeholder{border:2px dashed var(--border);border-inline-start:5px dashed var(--p1);box-shadow:none;background:transparent;}
.todo{display:inline-block;font-size:.72rem;background:#fef3c7;color:#92400e;padding:2px 10px;border-radius:12px;font-weight:700;margin-inline-start:8px;vertical-align:middle;}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
.toolbar input,.toolbar select{padding:12px 16px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--text);font-size:1rem;font-family:inherit;}
.toolbar input{flex:1;min-width:200px;}
.empty{text-align:center;color:var(--muted);padding:20px;}
.viewer{width:100%;height:600px;border:1px solid var(--border);border-radius:12px;margin-top:14px;background:#fff;}

/* Contact */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start;}
.contact-panel{background:linear-gradient(135deg,#3730a3,#0e7490);color:#fff;padding:38px;border-radius:26px;}
.contact-panel h3{font-size:1.5rem;margin-bottom:8px;}
.contact-panel p{opacity:.92;margin-bottom:20px;}
.contact-list{list-style:none;}
.contact-list li{margin-bottom:12px;}
.contact-list a{display:flex;align-items:center;gap:14px;color:#fff;text-decoration:none;background:rgba(255,255,255,.12);padding:12px 16px;border-radius:16px;transition:.25s;}
.contact-list a:hover{background:rgba(255,255,255,.24);transform:translateX(5px);}
[dir=rtl] .contact-list a:hover{transform:translateX(-5px);}
.contact-list .badge{min-width:42px;height:42px;border-radius:12px;background:#fff;color:#3730a3;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;}
.contact-list .label{font-weight:700;display:block;line-height:1.2;}
.contact-list .sub{font-size:.85rem;opacity:.85;word-break:break-all;direction:ltr;display:inline-block;}
.form-box{background:var(--card);padding:34px;border-radius:26px;box-shadow:var(--shadow);border:1px solid var(--border);}
.form-box h3{margin-bottom:16px;font-size:1.3rem;}
.field{margin-bottom:15px;}
.field label{display:block;font-weight:600;margin-bottom:6px;font-size:.95rem;}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:var(--bg);color:var(--text);font-size:1rem;font-family:inherit;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--p1);border-color:transparent;}
.field textarea{min-height:130px;resize:vertical;}
.form-box .btn{width:100%;}
.form-note{font-size:.82rem;color:var(--muted);margin-top:10px;}

footer{margin-top:90px;background:#0b1020;color:#cbd5e1;text-align:center;padding:36px 20px;}
.footer-links{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
.footer-links a{color:#94a3b8;text-decoration:none;}
.footer-links a:hover{color:#fff;}
footer small{color:#94a3b8;}
.to-top{position:fixed;inset-inline-end:22px;bottom:22px;width:48px;height:48px;border-radius:50%;background:var(--grad);color:#fff;border:none;font-size:1.3rem;cursor:pointer;box-shadow:var(--shadow);display:none;z-index:900;}
.to-top.show{display:block;}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .6s,transform .6s;}
.reveal.visible{opacity:1;transform:none;}

@media(max-width:1100px){
  .menu-btn{display:inline-block;}
  .nav-links{position:absolute;top:calc(100% + 8px);inset-inline:0;background:rgba(15,22,38,.97);border-radius:24px;flex-direction:column;padding:14px;gap:4px;display:none;align-items:stretch;border:1px solid rgba(255,255,255,.12);}
  .nav-links.open{display:flex;}
  nav{position:sticky;}
}
@media(max-width:900px){.about,.contact-grid{grid-template-columns:1fr;}.profile-box{position:static;}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto;}.reveal{transition:none;opacity:1;transform:none;}.bar i{transition:none;}.orb{animation:none;}}
@media print{
  nav,#progress,.hero-actions,.to-top,.toolbar,.contact-grid,.tabs,.orb,.grid-bg,.actions,.viewer{display:none!important;}
  body{background:#fff;color:#000;}
  header#home{background:#fff;color:#000;padding:20px;margin:0;}
  header#home h1{color:#000;-webkit-text-fill-color:#000;}
  .reveal{opacity:1!important;transform:none!important;}
  .card,.item,.t-item,.panel,.stat{box-shadow:none;border:1px solid #ccc;}
}
</style>
</head>

  return list.map((p,i) => `<div class="item reveal"><div class="meta">${esc(tr(p.venue))} · ${esc(tr(p.year))}</div><h3>${esc(tr(p.title))}</h3><div class="meta">${esc(tr(p.authors))}</div><p>${esc(tr(p.abstract))}</p>

          <div class="field"><label for="fmsg">${esc(t.ct[6])}</label><textarea id="fmsg" placeholder="${esc(t.ct[11])}"></textarea></div>
          <button type="submit" class="btn solid">${esc(t.ct[7])}</button>
          <p class="form-note" id="formNote">${esc(t.ct[8])}</p>
        </form>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-links">${ids.map((id,i)=>`<a href="#${id}">${esc(t.nav[i])}</a>`).join('')}</div>
    <small>© ${new Date().getFullYear()} ${esc(PROFILE.name)} | ${esc(t.tag.replace(/ \| /g,' • '))}</small>
  </footer>`;

  bind(t);
  setTheme(document.body.classList.contains('dark'));
  startTyping(t);
  reveal();
  firstRender = false;
}

function bind(t){
  $('#langSel').addEventListener('change', e => { lang = e.target.value; try{localStorage.setItem('lang',lang);}catch(_){} render(); window.scrollTo(0, scrollY); });
  $('#themeBtn').addEventListener('click', () => setTheme(!document.body.classList.contains('dark')));
  const nl = $('#navLinks'), mb = $('#menuBtn');
  mb.addEventListener('click', () => { const o = nl.classList.toggle('open'); mb.setAttribute('aria-expanded', o); });
  nl.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { nl.classList.remove('open'); mb.setAttribute('aria-expanded','false'); }));
  $('#journeyBody').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if(!b) return; tabIdx = +b.dataset.tab; $('#journeyBody').innerHTML = journeyHTML(T[lang]); });
  $('#pubBody').addEventListener('click', e => {
    const b = e.target.closest('[data-cite]'); if(!b) return; const p = PROFILE.publications[b.dataset.cite];
    const c = `${tr(p.authors)}. ${tr(p.title)}. ${tr(p.venue)}${p.year?', '+tr(p.year):''}.${p.doi?' https://doi.org/'+p.doi:''}`;
    navigator.clipboard.writeText(c).then(()=>{ b.textContent = T[lang].pub[4]; setTimeout(()=>b.textContent=T[lang].pub[3],1500); }).catch(()=>{});
  });
  $('#documents').addEventListener('click', e => {
    const b = e.target.closest('[data-view]'); if(!b) return; const i = b.dataset.view, box = $('#view'+i);
    if (box.innerHTML){ box.innerHTML=''; b.textContent = T[lang].docs[1]; }
    else { box.innerHTML = `<iframe class="viewer" src="${esc(PROFILE.docs[i].file)}" title="PDF"></iframe>`; b.textContent = T[lang].docs[2]; }
  });
  $('#artSearch').addEventListener('input', e => { artQ = e.target.value; $('#artBody').innerHTML = artList(T[lang]); });
  $('#artCat').addEventListener('change', e => { artC = +e.target.value; $('#artBody').innerHTML = artList(T[lang]); });
  $('#contactForm').addEventListener('submit', e => {
    e.preventDefault(); const t = T[lang];
    const n = $('#fname').value.trim(), m = $('#femail').value.trim(), tp = $('#ftopic').value, g = $('#fmsg').value.trim(), note = $('#formNote');
    if (!n || !/^\S+@\S+\.\S+$/.test(m) || !g){ note.textContent = t.ct[9]; note.style.color = '#dc2626'; return; }
    note.style.color = ''; note.textContent = t.ct[10];
    location.href = 'mailto:' + PROFILE.email + '?subject=' + encodeURIComponent('Website: ' + tp) + '&body=' + encodeURIComponent(n + ' <' + m + '>\n\n' + g);
  });
}

function setTheme(d){
  document.body.classList.toggle('dark', d);
  const b = $('#themeBtn'); if (b) b.textContent = d ? '☀️' : '🌙';
  try{ localStorage.setItem('theme', d?'dark':'light'); }catch(e){}
}
(function initTheme(){
  let s = null; try{ s = localStorage.getItem('theme'); }catch(e){}
  document.body.classList.toggle('dark', s ? s === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches));
})();

function startTyping(t){
  const token = ++typeToken, el = $('#typed'); let p = 0, c = 0, del = false;
  (function step(){
    if (token !== typeToken) return;
    const s = t.typed[p];
    if (reduce){ el.textContent = s; return; }
    el.textContent = s.slice(0, c);
    if (!del && c < s.length){ c++; setTimeout(step, 55); }
    else if (!del){ del = true; setTimeout(step, 1600); }
    else if (c > 0){ c--; setTimeout(step, 25); }
    else { del = false; p = (p+1) % t.typed.length; setTimeout(step, 300); }
  })();
}

function countUp(el){
  const target = +el.dataset.n, suf = el.dataset.s;
  if (reduce){ el.textContent = target + suf; return; }
  const t0 = performance.now();
  (function f(t){ const k = Math.min((t-t0)/1400,1); el.textContent = Math.round(target*(1-Math.pow(1-k,3))) + suf; if (k<1) requestAnimationFrame(f); })(t0);
}
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add('visible');
  e.target.querySelectorAll('[data-n]').forEach(countUp);
  e.target.querySelectorAll('[data-w]').forEach(b => b.style.width = b.dataset.w + '%');
  io.unobserve(e.target);
}), { threshold: .12 });
function reveal(){
  document.querySelectorAll('.reveal,.stats').forEach(el => {
    if (firstRender) io.observe(el);
    else { el.classList.add('visible'); el.querySelectorAll('[data-n]').forEach(n => n.textContent = n.dataset.n + n.dataset.s); el.querySelectorAll('[data-w]').forEach(b => b.style.width = b.dataset.w + '%'); }
  });
  if (firstRender) document.querySelectorAll('.skills').forEach(el => io.observe(el));
}

addEventListener('scroll', () => {
  const h = document.documentElement;
  $('#progress').style.width = (scrollY / Math.max(1, h.scrollHeight - h.clientHeight) * 100) + '%';
  const y = scrollY + 160; let cur = 'home';
  ids.forEach(id => { const s = document.getElementById(id); if (s && s.offsetTop <= y) cur = id; });
  document.querySelectorAll('#navLinks a').forEach(a => a.classList.toggle('active', a.dataset.id === cur));
  $('#toTop').classList.toggle('show', scrollY > 500);
}, { passive: true });
$('#toTop').addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));

render();
</script>
</body>
</html>
