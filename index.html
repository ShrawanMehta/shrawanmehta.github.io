function journey(t){const k=['experience','education','certifications'][tab],list=PROFILE[k];
 return `<div class="tabs">${t.tabs.map((n,i)=>`<button class="tab ${i==tab?'on':''}" data-tab="${i}">${esc(n)}</button>`).join('')}</div><div class="tl">${list.map(i=>`<div class="ti"><small>${esc(i.when)}</small><h4>${esc(i.title)}</h4><div class="org">${esc(i.org)}</div>${i.points.length?`<ul>${i.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}</div>`).join('')}</div>`}
function pubs(t){return PROFILE.publications.map((p,i)=>`<div class="item rv"><div class="m">${esc(p.venue)} · ${esc(p.year)}</div><h3>${esc(p.title)}</h3><div class="m">${esc(p.authors)}</div><p>${esc(p.abstract)}</p><a class="mini" target="_blank" rel="noopener noreferrer" href="https://doi.org/${esc(p.doi)}">${esc(t.pubT[0])}</a><button class="mini" data-cite="${i}">${esc(t.pubT[1])}</button></div>`).join('')}
function arts(t){const o=t.arts.map((a,i)=>({c:i,t:a[0],x:a[1]})).filter(a=>(cat==0||a.c==cat-1)&&(a.t+a.x).toLowerCase().includes(q.toLowerCase()));
 return o.length?o.map(a=>`<div class="item"><div class="m">${esc(t.art[3+a.c])}</div><h3>${esc(a.t)}</h3><p>${esc(a.x)}</p></div>`).join(''):`<p style="text-align:center;color:var(--muted)">${esc(t.art[2])}</p>`}
function docs(t){return `<div class="cards">${PROFILE.docs.map((d,i)=>{const n=d.key=='cv'?t.docs[3]:t.docs[4];
 return `<div class="card rv"><div class="ico">📄</div><h3>${esc(n)}</h3>${d.file?`<a class="mini" href="${esc(d.file)}" download>⬇ ${esc(t.docs[0])}</a><button class="mini" data-view="${i}">${esc(t.docs[1])}</button><div id="v${i}"></div>`:`<p>${esc(t.docs[5])}</p>`}</div>`}).join('')}
 <div class="card rv"><div class="ico">🖨️</div><h3>${esc(t.docs[6])}</h3><p>${esc(t.docs[7])}</p><button class="mini" onclick="window.print()">⬇ PDF</button></div></div>`}
function contact(){return [['@','Email',PROFILE.email,'mailto:'+PROFILE.email],['in','LinkedIn','linkedin.com/in/shrawanmehta',L.linkedin],['▶','YouTube','youtube.com/@shrawanmehta',L.youtube],['f','Facebook','facebook.com/theshrawanmehta',L.facebook],['IG','Instagram','instagram.com/theshrawanmehta',L.instagram],['🌐','Website','www.shrawanmehta.com',L.website]].map(([b,l,s,u])=>`<li><a href="${u}" ${u[0]=='h'?'target="_blank" rel="noopener noreferrer"':''}><span class="bg2">${b}</span><span><span class="l">${l}</span><span class="s">${esc(s)}</span></span></a></li>`).join('')}
const av=`<img src="${PHOTO}" alt="${esc(PROFILE.name)}" onerror="this.parentNode.textContent='SM'">`;
function render(){const t=T[lang];document.documentElement.lang=lang;
 const facts=[[t.lbl[0],t.focus],[t.lbl[1],PROFILE.languages],[t.lbl[2],PROFILE.location]];
 $('#root').innerHTML=`<nav><a href="#home" class="logo">Shrawan<span>Mehta</span></a><ul class="links" id="nl">${ids.map((id,i)=>`<li><a href="#${id}" data-id="${id}" class="${i?'':'on'}">${esc(t.nav[i])}</a></li>`).join('')}</ul>
 <div class="tools"><button class="ib ${music?'live':''}" id="mus" title="${esc(music?t.music[1]:t.music[0])}">${music?'🔊':'🎵'}</button><select class="ib" id="ls">${Object.keys(T).map(k=>`<option value="${k}" ${k==lang?'selected':''}>${T[k].n}</option>`).join('')}</select><button class="ib" id="th"></button><button class="ib" id="mb">☰</button></div></nav>
 <header id="home"><div class="aur"></div><div class="grid"></div><div class="hi"><div class="ph">${av}</div><span class="badge">${esc(t.badge)}</span><h1>${esc(PROFILE.name)}</h1><p class="tag">${esc(t.tag)}</p><p class="typed" id="typed"></p>
 <div class="acts"><a href="#contact" class="btn">${esc(t.btn[0])}</a><a href="#about" class="btn o">${esc(t.btn[1])}</a></div></div></header>
 <div class="wrap" style="padding-top:0"><div class="stats rv">${PROFILE.stats.map((s,i)=>`<div class="stat"><b data-n="${s.n}" data-s="${s.s}">0${s.s}</b><span>${esc(t.stats[i])}</span></div>`).join('')}</div></div>
 <section class="wrap" id="about">${sh(0,t)}<div class="about"><div class="pb rv"><div class="ph">${av}</div><h3>${esc(PROFILE.name)}</h3><p class="role">${esc(t.role)}</p><div class="chips">${t.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div><ul class="facts">${facts.map(([k,v])=>`<li><b>${esc(k)}</b><span>${esc(v)}</span></li>`).join('')}</ul></div>
 <div class="ac rv">${t.about.map(([h,p])=>`<h3>${esc(h)}</h3><p>${esc(p)}</p>`).join('')}<h3>${esc(t.expectT)}</h3><ul>${t.expect.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div></div></section>
 <section class="wrap" id="journey">${sh(1,t)}<div id="jb">${journey(t)}</div></section>
 <section class="wrap" id="skills">${sh(2,t)}<div class="panel sk rv">${t.skills.map((s,i)=>`<div><div class="r"><span>${esc(s)}</span><span>${PROFILE.skillLevels[i]}%</span></div><div class="br"><i data-w="${PROFILE.skillLevels[i]}"></i></div></div>`).join('')}</div></section>
 <section class="wrap" id="expertise">${sh(3,t)}<div class="cards">${t.exp.map(([h,p],i)=>`<div class="card rv"><div class="ico">${['🤖','💼','☁️','🚀'][i]}</div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join('')}</div></section>
 <section class="wrap" id="publications">${sh(4,t)}<div id="pb">${pubs(t)}</div></section>
 <section class="wrap" id="articles">${sh(5,t)}<div class="tb"><input type="search" id="as" placeholder="${esc(t.art[0])}" value="${esc(q)}"><select id="ac">${[t.art[1],t.art[3],t.art[4],t.art[5]].map((c,i)=>`<option value="${i}" ${i==cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div id="ab">${arts(t)}</div>
 <div class="item rv" style="border-left-color:var(--p2)"><h3>𝕏 @shrawanmehta0</h3><p>${esc(t.art[7])}</p><a class="mini" target="_blank" rel="noopener noreferrer" href="${PROFILE.xLink}">${esc(t.art[6])} →</a></div></section>
 <section class="wrap" id="documents">${sh(6,t)}${docs(t)}</section>
 <section class="wrap" id="contact">${sh(7,t)}<div class="cg"><div class="cp rv"><h3>${esc(t.ct[0])}</h3><p>${esc(t.ct[1])}</p><ul>${contact()}</ul></div>
 <div class="fb rv"><h3>${esc(t.ct[2])}</h3><form id="cf" novalidate><div class="fd"><label for="fn">${esc(t.ct[3])}</label><input id="fn" autocomplete="name"></div><div class="fd"><label for="fe">${esc(t.ct[4])}</label><input type="email" id="fe" autocomplete="email"></div><div class="fd"><label for="ft">${esc(t.ct[5])}</label><select id="ft">${t.topics.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="fd"><label for="fm">${esc(t.ct[6])}</label><textarea id="fm" placeholder="${esc(t.ct[11])}"></textarea></div><button class="btn s" type="submit">${esc(t.ct[7])}</button><p class="nt" id="nt">${esc(t.ct[8])}</p></form></div></div></section>
 <footer><small>© ${new Date().getFullYear()} ${esc(PROFILE.name)} | ${esc(t.tag.replace(/ \| /g,' • '))}</small></footer>`;
 bind();theme(document.body.classList.contains('dark'));typing(t);reveal();first=false}
function bind(){

 document.querySelectorAll('#nl a').forEach(a=>a.onclick=()=>$('#nl').classList.remove('open'));

 $('#documents').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;const i=b.dataset.view,x=$('#v'+i);if(x.innerHTML){x.innerHTML='';b.textContent=T[lang].docs[1]}else{x.innerHTML=`<iframe src="${esc(PROFILE.docs[i].file)}" title="PDF" style="width:100%;height:560px;border:1px solid var(--bd);border-radius:12px;margin-top:12px;background:#fff"></iframe>`;b.textContent=T[lang].docs[2]}};

function typing(t){const k=++tk,el=$('#typed');let p=0,c=0,del=false;(function st(){if(k!==tk)return;const s=t.typed[p];el.textContent=s.slice(0,c);
 if(!del&&c<s.length){c++;setTimeout(st,55)}else if(!del){del=true;setTimeout(st,1500)}else if(c>0){c--;setTimeout(st,25)}else{del=false;p=(p+1)%t.typed.length;setTimeout(st,300)}})()}
/* Ambient music: generated live with the Web Audio API (no file needed). Off by default; browsers require a click. */
function toggleMusic(){
 if(music){music.stop();music=null;render();return}
 const A=new (window.AudioContext||window.webkitAudioContext)(),m=A.createGain();m.gain.value=0;m.gain.linearRampToValueAtTime(.16,A.currentTime+3);m.connect(A.destination);
 const lp=A.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.connect(m);
 const lfo=A.createOscillator(),lg=A.createGain();lfo.frequency.value=.07;lg.gain.value=300;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
 const chords=[[110,164.8,220,329.6],[87.3,130.8,174.6,261.6],[98,146.8,196,293.7],[82.4,123.5,164.8,246.9]],oscs=[];
 [0,1,2,3].forEach(i=>{['sine','triangle'].forEach((ty,j)=>{const o=A.createOscillator();o.type=ty;o.frequency.value=chords[0][i];o.detune.value=j?6:-6;const g=A.createGain();g.gain.value=.12;o.connect(g);g.connect(lp);o.start();oscs.push(o)})});
 let ci=0;const iv=setInterval(()=>{ci=(ci+1)%chords.length;oscs.forEach((o,k)=>o.frequency.linearRampToValueAtTime(chords[ci][Math.floor(k/2)],A.currentTime+4))},9000);
 music={stop(){clearInterval(iv);m.gain.linearRampToValueAtTime(0,A.currentTime+.8);setTimeout(()=>A.close(),900)}};render()}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add('v');
 e.target.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n,t0=performance.now();(function f(t){const k=Math.min((t-t0)/1400,1);el.textContent=Math.round(n*(1-Math.pow(1-k,3)))+el.dataset.s;if(k<1)requestAnimationFrame(f)})(t0)});
 e.target.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%');io.unobserve(e.target)}),{threshold:.12});
