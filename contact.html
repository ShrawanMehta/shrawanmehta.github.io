<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Contact - Shrawan Mehta</title>

<meta name="description" content="Contact Shrawan Mehta">
<meta name="theme-color" content="#060914">

<link rel="stylesheet" href="css/style.css">

<!-- Social Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

.contact-form{
    max-width:700px;
    margin:40px auto;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.15);
    background:#111827;
    color:#fff;
    font-size:16px;
}

.contact-form textarea{
    resize:vertical;
}

.contact-form label{
    font-weight:600;
    display:block;
    margin-bottom:6px;
}

.btn{
    padding:14px 24px;
    border:none;
    border-radius:12px;
    background:#00d4ff;
    color:#000;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.contact-info{
    text-align:center;
    margin-top:40px;
}

.contact-info a{
    color:#00d4ff;
    text-decoration:none;
}

.social-icons{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.social-icons a{
    width:55px;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#0f172a;
    color:#fff;
    font-size:24px;
    transition:.3s ease;
    text-decoration:none;
}

.social-icons a:hover{
    background:#00d4ff;
    color:#000;
    transform:translateY(-5px);
}

</style>

</head>

<body>

<section class="wrap top">

<h2><span>Let's Connect</span></h2>

<p class="sub">
Collaborations, consulting, corporate training, speaking engagements,
educational initiatives and professional enquiries are welcome.
</p>

<form
class="contact-form"
action="https://formsubmit.co/info@shrawanmehta.com"
method="POST">

<input type="hidden"
name="_subject"
value="New Contact Request from ShrawanMehta.com">

<input type="hidden" name="_template" value="table">
<input type="hidden" name="_captcha" value="false">

<div>
<label>Full Name</label>
<input
type="text"
name="name"
placeholder="Enter your full name"
required>
</div>

<div>
<label>Email Address</label>
<input
type="email"
name="email"
placeholder="Enter your email address"
required>
</div>

<div>
<label>Subject</label>
<input
type="text"
name="subject"
placeholder="Subject"
required>
</div>

<div>
<label>Message</label>
<textarea
name="message"
rows="6"
placeholder="Write your message..."
required></textarea>
</div>

<button type="submit" class="btn">
Send Message
</button>

</form>

<div class="contact-info">

<h3>Direct Contact</h3>

<p>
📧 Email:
<a href="mailto:info@shrawanmehta.com">
info@shrawanmehta.com
</a>
</p>

<p>
🌐 Website:
<a href="https://shrawanmehta.com" target="_blank">
shrawanmehta.com
</a>
</p>

<h3>Follow Me</h3>

<div class="social-icons">

<a href="https://www.linkedin.com/in/shrawanmehta"
target="_blank"
title="LinkedIn">
<i class="fab fa-linkedin-in"></i>
</a>

<a href="https://www.youtube.com/@shrawanmehta"
target="_blank"
title="YouTube">
<i class="fab fa-youtube"></i>
</a>

<a href="https://www.facebook.com/drshrawanmehta"
target="_blank"
title="Facebook">
<i class="fab fa-facebook-f"></i>
</a>

<a href="https://www.instagram.com/theshrawanmehta/"
target="_blank"
title="Instagram">
<i class="fab fa-instagram"></i>
</a>

<a href="https://x.com/shrawanmehta0"
target="_blank"
title="X">
<i class="fa-brands fa-x-twitter"></i>
</a>

</div>

</div>

</section>
<script src="js/script.js"></script><script src="js/social.js"></script></body></html>
